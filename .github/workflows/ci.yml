name: Silver native CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Match the release workflow's target and pinned image.
      UBUNTU_IMAGE: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Make room for the cold OxCaml build
        shell: bash
        run: |
          df -h /
          # These preinstalled SDKs are unused by this job on the disposable
          # GitHub-hosted runner. The compiled opam switch alone can exceed 10 GiB.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Provision, build and test native Silver
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/checkout:ro" --workdir /checkout \
            --env SILVER_BUILD_JOBS=2 --env SILVER_TEST_JOBS=1 \
            "$UBUNTU_IMAGE" bash scripts/ci/container.sh
      - name: Report remaining runner disk space
        if: always()
        run: df -h /
